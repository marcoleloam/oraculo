[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oraculo"
version = "0.1.0"
description = "Local T3 orchestration and durable Obsidian memory"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "keyring==25.7.0", "pydantic==2.14.1", "PyYAML==6.0.3", "httpx2>=2.10,<3", "jsonschema>=4.20,<5"]

[project.scripts]
oraculo = "oraculo.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel.force-include]
"config/oraculo.example.toml" = "oraculo/assets/config/oraculo.example.toml"
"prompts" = "oraculo/assets/prompts"
"templates/vault" = "oraculo/assets/templates/vault"
