schema_version = 1
projects_root = "~/projects/work"
# Optional exact project allowlist. Omitted = all registered projects under root;
# [] = no project. Paths are resolved; nested projects are not implicitly allowed.
# allowed_projects = ["~/projects/work/projeto-a"]
vault_root = "~/Obsidian/Oraculo"
state_dir = "~/Library/Application Support/Oraculo"
t3_mcp_url = "https://t3.example.invalid/mcp"
max_executors = 1
poll_active_seconds = 15
poll_idle_seconds = 60
proactive_interval_seconds = 1800
max_dispatch_attempts = 3
max_correction_rounds = 2
quota_backoff_seconds = 1800
additional_spend_allowed = false

